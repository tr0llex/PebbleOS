<?xml version="1.0" encoding="utf-8"?>
<!-- Конец ленты. Апстрим рисует здесь «FIN» — киношную концовку, и это
     единственная надпись в интерфейсе, которую языковой пак взять не может:
     она не текст, а линии. Рисуем то же самое по-русски: «ВСЁ».

     Геометрия ленты и хвостов апстримовская до пикселя, поменяны только буквы.
     Полотнище пришлось поднять на два пикселя вверх (y 11 вместо 13) и на два
     удлинить: буквам «ВСЁ» нужно место под точки, а на прежней высоте они
     слипались с кромкой. Хвосты и загибы остались апстримовские.

     Буквы идут по y 18..25, точки над «Ё» — на y=15. Стиль заливки и обводки
     такой же, как у соседних фигур: конвертер в PDC разбирает их одинаково. -->
<svg version="1.1" id="Comments" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" x="0px" y="0px"
	 viewBox="0 0 50 50" enable-background="new 0 0 50 50" xml:space="preserve">
<polygon fill="#FFFFFF" stroke="#231F20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-miterlimit="10" points="
	6,26 2,32 15,32 15,20 2,20 "/>
<polygon fill="#FFFFFF" stroke="#231F20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-miterlimit="10" points="
	43,26 47,32 34,32 34,20 47,20 "/>
<rect x="11" y="11" fill="#FFFFFF" stroke="#231F20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-miterlimit="10" width="27" height="19"/>
<polyline fill="#FFFFFF" stroke="#231F20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-miterlimit="10" points="
	16,25 16,18 19,18 19,21 16,21 "/>
<polyline fill="#FFFFFF" stroke="#231F20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-miterlimit="10" points="
	16,21 20,21 20,25 16,25 "/>
<polyline fill="#FFFFFF" stroke="#231F20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-miterlimit="10" points="
	27,18 24,18 23,19 23,24 24,25 27,25 "/>
<polyline fill="#FFFFFF" stroke="#231F20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-miterlimit="10" points="
	34,18 30,18 30,25 34,25 "/>
<line fill="#FFFFFF" stroke="#231F20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-miterlimit="10" x1="30" y1="21.5" x2="33" y2="21.5"/>
<circle fill="#231F20" stroke="#231F20" stroke-width="1" cx="30.5" cy="15" r="1"/>
<circle fill="#231F20" stroke="#231F20" stroke-width="1" cx="33.5" cy="15" r="1"/>
<line fill="#FFFFFF" stroke="#231F20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-miterlimit="10" x1="11" y1="30" x2="14" y2="32"/>
<line fill="#FFFFFF" stroke="#231F20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-miterlimit="10" x1="38" y1="30" x2="35" y2="32"/>
</svg>
